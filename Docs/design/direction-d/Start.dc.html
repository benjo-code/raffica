<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Raffica Office – Start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&amp;family=Carlito:ital,wght@0,400;0,700;1,400&amp;family=Public+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.fa{--ink:#1D4F91;--on:#FFFFFF;--page:#FFFFFF;--band:#F5F6F8;--desk:#E9EBEE;--hov:#E6E8EC;--sel:#DCDFE4;--tx:#1A1D21;--tx2:#4A5059;--ctl:#7A818B;--rule:#D3D7DD;--dis:#9AA0A8;--rev:#7B2FBE;--revt:#F1EAF9;--red:#B21F2D;font-family:'Public Sans',system-ui,sans-serif;font-size:14px;line-height:1.3;color:var(--tx);background:var(--page);font-variant-numeric:tabular-nums;caret-color:var(--tx)}
.fa ::selection{background:#D6DAE0;color:var(--tx)}
.fa *{box-sizing:border-box}
.fa svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fa svg.i20{width:20px;height:20px}
.fa svg.i *{vector-effect:non-scaling-stroke}
.lbl{font-family:inherit;font-weight:400;font-size:12px;letter-spacing:normal;text-transform:none;line-height:1.2;color:var(--tx2,#4A5059)}
.btn{appearance:none;border:1px solid transparent;background:transparent;color:var(--tx);font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;min-width:26px;padding:0 5px;border-radius:0;cursor:pointer;position:relative;white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn:active,.btn.on{background:var(--ink);color:var(--on)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:disabled{color:var(--dis);background:transparent;cursor:default}
.btn.tall{flex-direction:column;height:54px;min-width:48px;gap:4px;font-size:12px}
.btn.box{border-color:var(--ctl);background:var(--page)}
.dd{appearance:none;display:inline-flex;align-items:center;justify-content:space-between;gap:6px;height:26px;padding:0 4px 0 7px;border:1px solid var(--ctl);background:var(--page);color:var(--tx);font:inherit;border-radius:0;cursor:pointer;position:relative;white-space:nowrap}
.dd:hover{background:var(--hov)}
.dd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.kz{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--rule);font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.02em;line-height:1;color:var(--tx2);background:transparent;white-space:nowrap}
.kz.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.cc{display:none}
.cc.on{display:inline-flex;position:absolute;right:-4px;bottom:-6px;z-index:3}
.gl{display:flex;align-items:center;gap:6px;height:14px}
.dt{appearance:none;height:28px;max-width:236px;min-width:0;display:inline-flex;align-items:center;gap:6px;padding:0 2px 0 10px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--tx2);font:inherit;cursor:pointer;flex:0 1 auto}
.dt:hover{background:var(--hov)}
.dt.cur{background:var(--band);border-color:var(--rule);color:var(--tx);font-weight:500;box-shadow:inset 0 3px 0 var(--ink)}
.dt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dtx{appearance:none;width:24px;height:24px;flex:none;border:0;background:transparent;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.dtx:hover{background:var(--hov);color:var(--tx)}
.dtb{appearance:none;border:0;padding:0;height:26px;background:transparent;color:inherit;font:inherit;min-width:0;display:flex;align-items:center;cursor:pointer}
.dtx:focus-visible,.dtb:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.tab{appearance:none;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--tx);font:inherit;font-weight:500;height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;position:relative}
.tab:hover{background:var(--hov)}
.tab.cur{background:var(--band);border-color:var(--ink);color:var(--ink);font-weight:600;margin-bottom:-1px;height:33px}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.band{height:82px;column-gap:8px;padding-left:2px;flex:none;display:flex;flex-wrap:wrap;overflow:hidden;background:var(--band);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.grp{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px 4px;flex:none}
.grp-row{display:flex;align-items:center;gap:2px}
.stk{display:flex;flex-direction:column;gap:2px}
.stk.tight{gap:2px;align-items:flex-start}
.xs{display:none}
.cmp .band{height:40px}
.cmp .grp{flex-direction:row;align-items:center;gap:2px;padding:6px 8px}
.cmp .grp > .gl,.cmp .btn.tall,.cmp .sty,.cmp .stymore{display:none}
.cmp .stk{flex-direction:row;align-items:center;gap:2px}
.cmp .xs{display:inline-flex}
.cmp .btn.lb{font-size:0;gap:0}
.ovf{display:none}
.cmp .ovf{display:inline-flex;width:24px;min-width:24px;padding:0;color:var(--tx2)}
.sty{appearance:none;width:90px;height:54px;border:1px solid var(--ctl);background:var(--page);color:var(--tx);display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px 5px;cursor:pointer;text-align:left;position:relative;font:inherit}
.sty:hover{background:var(--hov)}
.sty.on{background:var(--ink);border-color:var(--ink);color:var(--on)}
.sty:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sty .nm{font-size:12px;white-space:nowrap}
.out{appearance:none;display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--tx);font:inherit;text-align:left;padding:7px 12px;min-height:32px;cursor:pointer}
.out:hover{background:var(--hov)}
.out.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--ink);color:var(--tx);font-weight:600}
.out:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.out .n{font-weight:600;min-width:24px;color:var(--tx2)}
.out.on .n{color:var(--tx)}
.seg{appearance:none;flex:1 1 auto;height:24px;border:1px solid var(--ctl);margin-left:-1px;background:var(--page);color:var(--tx);font:inherit;font-size:12px;padding:0 5px;cursor:pointer;white-space:nowrap}
.seg:hover{background:var(--hov)}
.seg.on{background:var(--sel);color:var(--tx);font-weight:600;box-shadow:inset 0 -3px 0 var(--ink);position:relative}
.cap{appearance:none;width:46px;height:36px;border:0;background:transparent;color:var(--tx);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cap:hover{background:var(--hov)}
.cap.x:hover{background:var(--tx);color:var(--on)}
.stat{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border:1px solid var(--rule);background:var(--page);white-space:nowrap}
.pf{outline:1px solid var(--ink);outline-offset:-1px}
.desk{scrollbar-color:var(--ctl) var(--desk);scrollbar-width:thin}
.doc{font-family:'Carlito',Calibri,sans-serif;color:var(--tx);font-size:15px;line-height:1.5}
.doc p{margin:0 0 11px}
.doc h1{font-size:22px;font-weight:700;margin:0 0 12px;line-height:1.2}
.doc h2{font-size:17px;font-weight:700;margin:16px 0 8px;line-height:1.2}
.doc table{border-collapse:collapse;width:100%;margin:4px 0 6px;font-size:14px}
.doc th{text-align:left;font-weight:700;border-bottom:1.5px solid var(--tx);padding:4px 8px}
.doc td{border-bottom:1px solid #C9CDD3;padding:4px 8px}
.doc td.r,.doc th.r{text-align:right}
.ins{color:var(--rev);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.anc{background:var(--revt);box-shadow:inset 0 -2px 0 var(--rev)}
.ruler span{flex:1;border-left:1px solid var(--ctl);height:6px;align-self:flex-end;position:relative}
.kz.off{display:none}
.sb{height:30px;flex:none;display:flex;align-items:center;gap:20px;padding:0 8px 0 12px;background:var(--band);border-top:1px solid var(--rule);overflow:hidden}
.sc{display:inline-flex;align-items:center;height:20px;color:var(--tx2);font-size:13px;white-space:nowrap}
.sc.zl{min-width:40px;justify-content:flex-end}
.sb .btn{height:24px;min-width:24px;color:var(--tx2)}
.phd{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px}
.phd .sv{margin-left:auto}
.sv{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
.pf .ph{color:var(--tx)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.am{min-width:20px;height:20px;padding:0 3px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;font-weight:600;font-size:12px;line-height:1}
.nt{appearance:none;position:relative;height:150px;border:1px solid var(--ctl);border-radius:3px;background:var(--page);color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:6px 6px 10px;cursor:pointer;text-align:center}
.nt .pvw{flex:1;display:flex;align-items:center;justify-content:center;background:#E9EBEE;border-radius:2px}
.nt .am{position:absolute;left:10px;top:10px;min-width:18px;height:18px;font-size:11px;z-index:1}
.nt .ntl{font-size:13px;font-weight:500;white-space:nowrap}
.nt:hover{background:var(--hov)}
.nt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fh,.fr{display:grid;grid-template-columns:28px minmax(0,2.4fr) minmax(0,1.7fr) 96px;align-items:center;column-gap:12px;padding:0 12px}
.fh{height:28px}
.fr{appearance:none;height:40px;width:100%;border:0;background:transparent;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.fr:hover,.fr.hv{background:var(--hov)}
.fr.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--ink)}
.fr.on .fn{font-weight:600}
.fr:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--tx2)}
.fd{font-size:13px;color:var(--tx2);text-align:right}

.btn,.btn.tall,.dd,.fld,.sty,.dz,.dtx,.b,.f,.swt,.tog,.db,.nt,.cm,.tip,.dlg,.nb,.kz,.mx .mi,.slw select,.fld input,.srch label,.sbx{border-radius:3px}
.cb{border-radius:2px}
.seg{border-radius:0}.seg:first-child{border-radius:3px 0 0 3px}.seg:last-child{border-radius:0 3px 3px 0}
.sg span{border-radius:0}.sg:first-child span{border-radius:3px 0 0 3px}.sg:last-child span{border-radius:0 3px 3px 0}
input::placeholder,textarea::placeholder{color:var(--tx2,#4A5059);opacity:1}
.sk{color:var(--tx2,#4A5059);font-size:12px;font-weight:400;white-space:nowrap}
</style>
</helmet>
<div class="{{rootCls}}" style="width: 100%; height: 900px; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Title bar: app mark, document tabs, command search, caption buttons -->
  <div style="height: 36px; flex: none; display: flex; align-items: flex-end; gap: 12px; padding-left: 12px;">
    <div style="height: 36px; display: flex; align-items: center; gap: 9px; flex: none;">
      <span aria-hidden="true" style="width: 20px; height: 20px; flex: none; background: #1D4F91; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px;">W</span>
      <span class="lbl">Raffica Write</span>
    </div>
    <div style="flex: 1 1 auto; min-width: 0;"></div>
    <div style="height: 36px; flex: 0 1 300px; min-width: 200px; display: flex; align-items: center;">
      <label title="Suchen (Strg+K)" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 28px; border: 1px solid #7A818B; border-radius: 3px; background: #FFFFFF; padding: 0 8px; position: relative;">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="color: #4A5059;"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3.5 3.5"></path></svg>
        <input aria-label="Suchen" placeholder="Suchen" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: #1A1D21;">
        <span class="{{cc}}">Q</span>
      </label>
    </div>
    <div style="height: 36px; flex: none; display: flex; justify-content: flex-end;">
      <button class="cap" aria-label="Minimieren"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"></path></svg></button>
      <button class="cap" aria-label="Maximieren"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8"></rect></svg></button>
      <button class="cap x" aria-label="Schließen"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"></path></svg></button>
    </div>
  </div>

  <!-- Start view: what each app shows with no file open -->
  <div style="flex: 1; min-height: 0; display: flex; border-top: 1px solid #D3D7DD;">
    <nav aria-label="Start" style="width: 336px; flex: none; background: #F5F6F8; border-right: 1px solid #D3D7DD; padding: 16px 12px; display: flex; flex-direction: column; gap: 28px;">
      <section aria-labelledby="st-neu" style="display: flex; flex-direction: column; gap: 10px;">
        <h2 id="st-neu" class="lbl" style="margin: 0;">Neu</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <button class="nt"><span class="am" aria-hidden="true" style="background: #1D4F91;">W</span><span class="pvw" aria-hidden="true"><span style="width: 48px; height: 64px; background: #FFFFFF;"></span></span><span class="ntl">Leeres Dokument</span></button>
          <button class="nt"><span class="am" aria-hidden="true" style="background: #1E6B47;">S</span><span class="pvw" aria-hidden="true"><svg viewBox="0 0 90 60" aria-hidden="true" style="width: 90px; height: 60px; background: #FFFFFF; display: block;"><path d="M0 12h90M0 24h90M0 36h90M0 48h90M18 0v60M36 0v60M54 0v60M72 0v60" stroke="#D3D7DD" stroke-width="1" fill="none"></path></svg></span><span class="ntl">Leere Tabelle</span></button>
          <button class="nt"><span class="am" aria-hidden="true" style="background: #A3420F;">SL</span><span class="pvw" aria-hidden="true"><span style="width: 96px; height: 54px; background: #FFFFFF;"></span></span><span class="ntl">Leere Präsentation</span></button>
          <button class="nt"><span class="am" aria-hidden="true" style="background: #5E1A3E;">PDF</span><span class="pvw" aria-hidden="true"><span style="width: 48px; height: 64px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #4A5059;"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h4.5L8 6h6v7.5H2z"></path></svg></span></span><span class="ntl">PDF öffnen</span></button>
        </div>
      </section>
      <section aria-labelledby="st-off" style="display: flex; flex-direction: column; gap: 10px;">
        <h2 id="st-off" class="lbl" style="margin: 0;">Öffnen</h2>
        <button class="btn box" style="height: 32px; justify-content: flex-start; padding: 0 10px; gap: 8px;"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h4.5L8 6h6v7.5H2z"></path></svg>Durchsuchen …</button>
        <p style="margin: 0; font-size: 12px; color: #4A5059; line-height: 1.45;">Öffnet den Dateidialog des Systems.</p>
      </section>
    </nav>
    <main aria-label="Zuletzt verwendet" style="flex: 1; min-width: 0; background: #FFFFFF; overflow: auto; padding: 20px 32px 32px;">
      <div style="max-width: 1040px; display: flex; flex-direction: column; gap: 6px;">
        <h1 style="margin: 0 0 10px; font-size: 18px; font-weight: 600;">Zuletzt verwendet</h1>
        <div class="fh" aria-hidden="true"><span></span><span class="lbl">Name</span><span class="lbl">Ordner</span><span class="lbl" style="text-align: right;">Geändert</span></div>
        <section aria-label="Angeheftet" style="display: flex; flex-direction: column;">
          <h2 class="lbl" style="margin: 6px 0 4px 12px; color: #4A5059;">Angeheftet</h2>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #1D4F91;">W</span><span class="fn">Gemeinschaftsgarten – Jahresbericht 2026.docx</span><span class="fp">Dokumente › Gemeinschaftsgarten</span><span class="fd">02.11.2026</span></button>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #1E6B47;">S</span><span class="fn">Gemeinschaftsgarten – Budget 2026.xlsx</span><span class="fp">Dokumente › Gemeinschaftsgarten</span><span class="fd">02.11.2026</span></button>
        </section>
        <section aria-label="Weitere Dateien" style="display: flex; flex-direction: column;">
          <h2 class="lbl" style="margin: 14px 0 4px 12px; color: #4A5059;">Weitere Dateien</h2>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #A3420F;">SL</span><span class="fn">Gemeinschaftsgarten – Jahresversammlung.pptx</span><span class="fp">Dokumente › Gemeinschaftsgarten</span><span class="fd">01.11.2026</span></button>
          <button class="fr hv"><span class="am" aria-hidden="true" style="background: #5E1A3E;">PDF</span><span class="fn">Schadenmeldung Geräteschuppen.pdf</span><span class="fp">Downloads</span><span class="fd">30.10.2026</span></button>
          <button class="fr on" aria-current="true"><span class="am" aria-hidden="true" style="background: #1D4F91;">W</span><span class="fn">Brief an das Grünflächenamt.docx</span><span class="fp">Dokumente › Gemeinschaftsgarten</span><span class="fd">28.10.2026</span></button>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #1E6B47;">S</span><span class="fn">Mitgliederliste 2026.xlsx</span><span class="fp">Dokumente › Gemeinschaftsgarten</span><span class="fd">27.10.2026</span></button>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #1D4F91;">W</span><span class="fn">Protokoll Vorstandssitzung.docx</span><span class="fp">Dokumente › Gemeinschaftsgarten › Protokolle</span><span class="fd">21.10.2026</span></button>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #5E1A3E;">PDF</span><span class="fn">Förderbescheid 2026.pdf</span><span class="fp">Downloads</span><span class="fd">15.10.2026</span></button>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #1E6B47;">S</span><span class="fn">Haushaltsbudget 2026.xlsx</span><span class="fp">Dokumente › Finanzen</span><span class="fd">12.10.2026</span></button>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #5E1A3E;">PDF</span><span class="fn">Nebenkostenabrechnung 2025.pdf</span><span class="fp">Dokumente › Wohnung</span><span class="fd">08.10.2026</span></button>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #1D4F91;">W</span><span class="fn">Kündigung Stromvertrag.docx</span><span class="fp">Dokumente › Wohnung</span><span class="fd">29.09.2026</span></button>
          <button class="fr"><span class="am" aria-hidden="true" style="background: #5E1A3E;">PDF</span><span class="fn">Lohnsteuerbescheinigung 2025.pdf</span><span class="fp">Dokumente › Finanzen › Steuer</span><span class="fd">14.09.2026</span></button>
        </section>
      </div>
    </main>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"altHeld":{"editor":"boolean","default":false,"section":"Zustand"},"compact":{"editor":"boolean","default":false,"section":"Zustand"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const alt = this.props.altHeld ?? false;
    const compact = this.props.compact ?? false;
    const ruler = [];
    for (let i = 0; i < 21; i++) ruler.push({ n: i > 0 && i % 2 === 0 ? String(i) : '' });
    return {
      alt: alt,
      ruler: ruler,
      rootCls: compact ? 'fa cmp' : 'fa',
      gk: alt ? 'kz on' : 'kz off',
      tk: alt ? 'kz on' : 'kz off',
      cc: alt ? 'kz cc on' : 'kz cc'
    };
  }
}
</script>
