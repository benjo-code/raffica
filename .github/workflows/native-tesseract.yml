name: Native Tesseract

# Builds the OCR library (Tesseract + Leptonica in one shared library, packaging/native/) and uploads it to a PRERELEASE of
# this repository named native-tesseract-<Tesseract version>-<build number>. Started by hand only:
#   gh workflow run native-tesseract.yml --ref dev -f build=1                    (Windows and Linux, build 1)
#   gh workflow run native-tesseract.yml --ref <branch> -f build=2 -f systems=macos   (macOS x86_64 and arm64, build 2)
# "systems" is all (the windows and linux jobs only) or macos (the macos job only); every build number is its own prerelease,
# so the macOS libraries live in the -2 release (the pins of osx-x64 and osx-arm64 point at it) and never in the -1 release
# of Windows and Linux. The tag is always native-tesseract-<Tesseract version>-<build>; the macos job refuses build number 1.
# The tag never starts with "v": the update check reads releases/latest and release.yml accepts SemVer tags only, so this
# prerelease can never be mistaken for an app release (Docs/DECISIONS.md, "Raffica PDF: redaction, OCR and text editing conventions (M2.5)", item 13).
# After the run, Pins.Libraries in tools/native-fetch.cs gets the size and SHA-256 of each file from the job summary; `native-fetch`
# checks them. GitHub-hosted runners only: nothing here needs the own runners, and the build runs third-party source code.

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build number n of the tag native-tesseract-<version>-<n> (a rebuild of the same version is a new number)'
        required: true
        type: string
      systems:
        description: 'Which libraries to build: all (Windows and Linux only) or macos (x86_64 and arm64 only)'
        required: false
        default: all
        type: choice
        options:
          - all
          - macos

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the prerelease
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.build }}
        run: |
          [[ "$BUILD" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "build '$BUILD' is not a number" >&2; exit 1; }
          source <(grep -E '^[A-Z_]+=' packaging/native/versions.txt)
          TAG="native-tesseract-${TESSERACT_TAG}-${BUILD}"
          [[ "$TAG" =~ ^v ]] && { echo "the tag must not start with v" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists already; a rebuild needs a new number" >&2; exit 1; fi
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Tesseract ${TESSERACT_TAG} and Leptonica ${LEPTONICA_TAG} as one library per system (packaging/native/). Not an app version; tools/native-fetch.cs fetches the files with a pinned SHA-256."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    if: ${{ inputs.systems == 'all' }}
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tesseract.dll
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/native/build-windows.ps1 -OutDir artifacts/native/win-x64
      - name: Check the dependencies
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -like '*Hostx64\x64*' } | Select-Object -First 1
          $dll = 'artifacts/native/win-x64/tesseract.dll'
          $dependents = (& $dumpbin.FullName /dependents $dll | Select-String '\.dll$' | ForEach-Object { $_.Line.Trim() }) | Where-Object { $_ -notlike 'Dump of*' }
          Write-Host "dependents: $dependents"
          if (($dependents | Where-Object { $_ -ne 'KERNEL32.dll' }).Count -gt 0) { throw "tesseract.dll depends on more than KERNEL32.dll: $dependents" }
          $exports = & $dumpbin.FullName /exports $dll
          foreach ($name in 'TessBaseAPICreate', 'TessBaseAPIInit3', 'TessBaseAPISetImage', 'TessBaseAPIRecognize', 'TessResultIteratorGetUTF8Text') {
            if (-not ($exports | Select-String -SimpleMatch $name)) { throw "export $name is missing" }
          }
      - name: Upload and print the pins
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload $env:TAG artifacts/native/win-x64/tesseract.dll --clobber
          $file = Get-Item artifacts/native/win-x64/tesseract.dll
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "| file | size | sha256 |`n| --- | --- | --- |`n| tesseract.dll | $($file.Length) | $hash |" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  linux:
    if: ${{ inputs.systems == 'all' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build libtesseract.so in ubuntu:22.04
        run: bash packaging/native/container-build.sh artifacts/native/linux-x64
      - name: Check the binary
        run: |
          dotnet run tools/check-binary.cs -- artifacts/native/linux-x64/libtesseract.so --max-glibc 2.35 --max-glibcxx 3.4.30
          if nm -D artifacts/native/linux-x64/libtesseract.so | grep -E ' (curl_|archive_|omp_|GOMP_)'; then echo "unexpected symbols (curl, archive, OpenMP)" >&2; exit 1; fi
          for name in TessBaseAPICreate TessBaseAPIInit3 TessBaseAPISetImage TessBaseAPIRecognize TessResultIteratorGetUTF8Text; do
            nm -D --defined-only artifacts/native/linux-x64/libtesseract.so | grep -q " T $name\$" || { echo "export $name is missing" >&2; exit 1; }
          done
      - name: Upload and print the pins
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" artifacts/native/linux-x64/libtesseract.so --clobber
          f=artifacts/native/linux-x64/libtesseract.so
          echo '| file | size | sha256 |' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "| libtesseract.so | $(stat -c %s "$f") | $(sha256sum "$f" | cut -d' ' -f1) |" | tee -a "$GITHUB_STEP_SUMMARY"

  macos:
    if: ${{ inputs.systems == 'macos' }}
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            asset: libtesseract-osx-x64.dylib
          - arch: arm64
            asset: libtesseract-osx-arm64.dylib
    steps:
      - name: Refuse the release of Windows and Linux
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # The macOS libraries belong to build 2 or later; build 1 is the release of tesseract.dll and libtesseract.so.
          [[ "$TAG" =~ -[1-9][0-9]*$ ]] && [[ ! "$TAG" =~ -1$ ]] || { echo "the macOS libraries must not go into $TAG (use build 2 or later)" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build libtesseract.dylib
        env:
          ARCH: ${{ matrix.arch }}
        run: bash packaging/native/build-macos.sh . "artifacts/native/macos-$ARCH" "$ARCH"
      - name: Check the binary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          source <(grep -E '^[A-Z_]+=' packaging/native/versions.txt)
          dir="artifacts/native/macos-$ARCH"
          f="$dir/libtesseract.dylib"
          dotnet run tools/check-binary.cs -- "$f" --arch "$ARCH" --max-macos "$MACOS_DEPLOYMENT_TARGET" --bundle "$dir"
          if nm -gU "$f" | grep -E ' _?(curl_|archive_|omp_|GOMP_)'; then echo "unexpected symbols (curl, archive, OpenMP)" >&2; exit 1; fi
          for name in TessBaseAPICreate TessBaseAPIInit3 TessBaseAPISetImage TessBaseAPIRecognize TessResultIteratorGetUTF8Text; do
            nm -gU "$f" | grep -q " T _$name\$" || { echo "export $name is missing" >&2; exit 1; }
          done
      - name: Upload and print the pins
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}
        run: |
          # The release asset name carries the architecture; the file in the release is the built one under that name.
          cp "artifacts/native/macos-$ARCH/libtesseract.dylib" "artifacts/native/macos-$ARCH/$ASSET"
          gh release upload "$TAG" "artifacts/native/macos-$ARCH/$ASSET" --clobber
          f="artifacts/native/macos-$ARCH/$ASSET"
          # Each matrix job has its own job summary: the table has the same shape as in the other jobs.
          echo '| file | size | sha256 |' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "| $ASSET | $(stat -f %z "$f") | $(shasum -a 256 "$f" | cut -d' ' -f1) |" | tee -a "$GITHUB_STEP_SUMMARY"
