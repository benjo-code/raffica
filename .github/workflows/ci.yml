name: CI

# As few runs as possible, without losing a check:
# - Pull requests (not drafts) are checked. There is no second run when the squash merge lands on dev: the pull request
#   run already checked the same tree. Pushes to main (releases) run in full.
# - A pull request that changes only documentation (Docs/, Markdown in the root and in bench/, LICENSE) skips the build;
#   the required status check "ci" still reports, so the branch protection never waits.
# - Stale runs of the same ref are cancelled.
# - The macOS job (hosted runner, there is no self-hosted Mac) runs for pull requests into main, pushes to main, a pull
#   request with the label ci:macos and a pull request that touches platform-near files (.github/scripts/macos-paths.sh).
# While the repository is private everything runs on the owner's self-hosted runners; once it is public (or for a pull
# request from a fork) every job goes to GitHub-hosted runners. This routing is a convenience: the boundary that keeps
# foreign code off the owner's machines is the runner group (restricted to release.yml on main and dev), because a fork
# controls the workflow file of its own pull request (packaging/README.md, "Making the repository public").
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# Stale runs of the same ref are cancelled so the runners are not blocked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Avalonia.BuildServices would send anonymous usage data while compiling; the app itself never connects anywhere.
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  # Decides whether the build runs and where (hosted runners: public repository or a pull request from a fork).
  changes:
    name: changes
    runs-on: ${{ fromJSON((github.event.repository.private == false || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-24.04"]' || '["self-hosted","dotnet-linux"]') }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      hosted: ${{ steps.diff.outputs.hosted }}
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test of the macOS path filter
        shell: bash
        run: bash .github/scripts/macos-paths.test.sh

      - name: Decide
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FORK: ${{ (github.event.repository.private == false || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) }}
        run: |
          echo "hosted=$FORK" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then
            echo "A draft pull request is not built."
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "macos=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pushes to main and pull requests into main (releases) are always built in full.
          if [ "$EVENT" != pull_request ] || [ "$BASE" = main ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout of a pull request is the merge commit; its first parent is the tip of the base branch.
          code=false
          files=$(git diff --name-only HEAD^1 HEAD)
          [ -n "$files" ] || code=true
          while IFS= read -r f; do
            case "$f" in
              '') ;;
              Docs/*|LICENSE|bench/*.md|bench/*/*.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "Changed files:"; echo "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The macOS job: only with code to build, then on the label ci:macos or a platform-near file.
          macos=false
          if [ "$code" = true ]; then
            case ",$LABELS," in *,ci:macos,*) macos=true ;; esac
            if hit=$(printf '%s\n' "$files" | bash .github/scripts/macos-paths.sh); then
              echo "Platform-near file: $hit"
              macos=true
            fi
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.hosted == 'true' && format('["{0}"]', matrix.hosted) || format('["self-hosted","{0}"]', matrix.label)) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, label: dotnet-linux, hosted: ubuntu-24.04, rid: linux-x64, binary: raffica }
          - { name: windows, label: dotnet-windows, hosted: windows-2025, rid: win-x64, binary: raffica.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No root on the owner's runners: the SDK goes into the user's folder.
      - name: Set DOTNET_INSTALL_DIR (Linux)
        if: runner.os == 'Linux'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Set DOTNET_INSTALL_DIR (Windows)
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_ENV -Value "DOTNET_INSTALL_DIR=$env:USERPROFILE\.dotnet"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The Native AOT linker needs vswhere.exe on PATH; it takes effect from the next step on.
      - name: Put vswhere on PATH
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      # Only on a GitHub-hosted runner (public repository or fork pull request): the image has most of this, but it is not guaranteed.
      - name: Install the Native AOT prerequisites (Linux, hosted runner)
        if: runner.os == 'Linux' && needs.changes.outputs.hosted == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # The self-hosted runner is set up by hand and has no root: check that it has what the AOT publish needs.
      - name: Check the Native AOT prerequisites (Linux, self-hosted runner)
        if: runner.os == 'Linux' && needs.changes.outputs.hosted != 'true'
        run: |
          command -v clang >/dev/null || { echo 'clang not found: install the clang package' >&2; exit 1; }
          test -f /usr/include/zlib.h || { echo 'zlib.h not found: install zlib1g-dev' >&2; exit 1; }

      - name: Restore
        run: dotnet restore Raffica.slnx

      - name: Build
        run: dotnet build Raffica.slnx -c Release --no-restore

      # The OCR tests need the real library (SHA-256 pinned in tools/native-fetch.cs); without it they would only report
      # themselves as skipped, which RAFFICA_REQUIRE_OCR below turns into a failure.
      - name: Fetch the OCR library and the language data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run tools/native-fetch.cs -- --rid ${{ matrix.rid }} --out artifacts/native/${{ matrix.rid }}

      # One test module at a time: the PDFium-heavy Core tests starve each other's timing on a machine with few cores.
      - name: Test
        env:
          RAFFICA_REQUIRE_OCR: '1'
        run: dotnet test Raffica.slnx -c Release --no-build --max-parallel-test-modules 1

      # Renderings and diff images of failed render regression tests (see tests/Raffica.Render.Tests).
      - name: Upload the render diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff-${{ matrix.name }}
          path: tests/Raffica.Render.Tests/**/render-diff/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Format
        run: dotnet format Raffica.slnx --verify-no-changes --no-restore

      # Staging and rejection of the OCR library fetch (a wrong hash lays nothing down), which the normal fetch above does not hit.
      - name: Self-test of the OCR library fetch
        run: dotnet run tools/native-fetch.cs -- selftest

      - name: Publish the CLI (Native AOT)
        run: dotnet publish src/Raffica.Cli -c Release -r ${{ matrix.rid }} -o out/cli

      # The published binary must start, load PDFium and extract text from a test PDF ("Hello, ..." is drawn into the fixture).
      - name: Smoke test of the CLI binary (Linux)
        if: runner.os == 'Linux'
        run: |
          ./out/cli/${{ matrix.binary }} --help > /dev/null
          text=$(./out/cli/${{ matrix.binary }} text testdata/pdfs/text-basic.pdf)
          case "$text" in *"Hello,"*) echo "text extraction works" ;; *) echo "unexpected output: $text" >&2; exit 1 ;; esac

      # PowerShell, not bash: the self-hosted Windows runner does not have bash on PATH.
      - name: Smoke test of the CLI binary (Windows)
        if: runner.os == 'Windows'
        run: |
          & ./out/cli/${{ matrix.binary }} --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited with $LASTEXITCODE" }
          $text = (& ./out/cli/${{ matrix.binary }} text testdata/pdfs/text-basic.pdf) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "text exited with $LASTEXITCODE" }
          if ($text -notlike '*Hello,*') { throw "unexpected output: $text" }
          Write-Host 'text extraction works'

      # The gallery of the design system. The publish proves that the gallery builds as Native AOT without warnings; --print-string
      # proves that the resource lookup works in the published binary. It runs before any window exists, so no display is needed and
      # CI does not show that the AXAML, fonts and styles render (the local --screenshot run does).
      - name: Publish the gallery (Native AOT)
        run: dotnet publish src/Raffica.Gallery -c Release -r ${{ matrix.rid }} -o out/gallery

      # The size limits of the speed targets (Docs/DECISIONS.md, "Speed targets of the frame (M1)"): the published gallery and its zip
      # must stay within budget x 1.25. Fails above the limit; budgets are never loosened here.
      # --no-cache: a file-based app (measure.cs) is built once and reused by the up-to-date check of `dotnet run`; on the persistent
      # runners a build of an older measure.cs made a step run the old script (run 41856451033 printed a message that no longer exists
      # in the checked-out file). Building every time costs a few seconds and cannot run a stale script.
      # run 41874712000 showed that --no-cache is not enough on the persistent Windows runner (the PDF step ran a measure.cs without the
      # limits recorded in the checkout), so the build of the file-based app also goes into the temp folder of this job, which the runner
      # empties for every job.
      - name: Size of the published gallery
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: dotnet run --no-cache bench/shell-probe/measure.cs -- size --check ${{ matrix.rid }} --publish-dir out/gallery --fonts-dir src/Raffica.Shell/Assets/Fonts

      - name: Smoke test of the gallery binary (Linux)
        if: runner.os == 'Linux'
        run: |
          de=$(./out/gallery/RafficaGallery --print-string Cancel --lang de)
          [ "$de" = "Abbrechen" ] || { echo "expected 'Abbrechen' with --lang de, got: $de" >&2; exit 1; }
          en=$(./out/gallery/RafficaGallery --print-string Cancel --lang en)
          [ "$en" = "Cancel" ] || { echo "expected 'Cancel' with --lang en, got: $en" >&2; exit 1; }
          echo "the published gallery prints German and English strings"

      # RafficaGallery.exe is a GUI-subsystem program: PowerShell does not wait for it and does not capture its output when it is
      # simply called. Start-Process -Wait with redirected output files waits and gives a reliable exit code.
      - name: Smoke test of the gallery binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $exe = (Resolve-Path ./out/gallery/RafficaGallery.exe).Path
          foreach ($case in @(@('de', 'Abbrechen'), @('en', 'Cancel'))) {
            $lang = $case[0]; $expected = $case[1]
            $out = Join-Path $env:RUNNER_TEMP "gallery-$lang.out"
            $err = Join-Path $env:RUNNER_TEMP "gallery-$lang.err"
            $p = Start-Process -FilePath $exe -ArgumentList '--print-string', 'Cancel', '--lang', $lang -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if ($p.ExitCode -ne 0) { throw "--lang $lang exited with $($p.ExitCode): $(Get-Content $err -Raw)" }
            $text = (Get-Content $out -Raw).Trim()
            if ($text -ne $expected) { throw "expected '$expected' with --lang $lang, got: '$text'" }
          }
          Write-Host 'the published gallery prints German and English strings'

      # The PDF app: the same two proofs as for the gallery (Native AOT publish without warnings, resource lookup in the published
      # binary through --print-string, which needs no display).
      - name: Publish the PDF app (Native AOT)
        run: dotnet publish src/Raffica.Pdf -c Release -r ${{ matrix.rid }} -o out/pdf

      # The Write corpus tool (bench/write-corpus) is the Native AOT proof of the DOCX libraries: it must publish without trim or AOT
      # warnings (any IL2xxx or IL3xxx in the log fails the step) and the published binary must run its checks. The check also fails when a required
      # feature has no corpus file.
      - name: Publish the Write corpus tool (Native AOT, Linux)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          mkdir -p out
          dotnet publish bench/write-corpus -c Release -r ${{ matrix.rid }} -o out/write-corpus 2>&1 | tee out/write-corpus-publish.log
          if grep -E 'IL[23][0-9]{3}' out/write-corpus-publish.log; then echo "the Write corpus tool publish has trim or AOT warnings" >&2; exit 1; fi

      - name: Publish the Write corpus tool (Native AOT, Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          dotnet publish bench/write-corpus -c Release -r ${{ matrix.rid }} -o out/write-corpus 2>&1 | Tee-Object -FilePath out/write-corpus-publish.log
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish exited with $LASTEXITCODE" }
          if (Select-String -Path out/write-corpus-publish.log -Pattern 'IL[23][0-9]{3}' -Quiet) { throw 'the Write corpus tool publish has trim or AOT warnings' }

      - name: Corpus check and round trip of the published tool (Linux)
        if: runner.os == 'Linux'
        run: |
          ./out/write-corpus/write-corpus check --root testdata/write-corpus
          ./out/write-corpus/write-corpus run --root testdata/write-corpus

      - name: Corpus check and round trip of the published tool (Windows)
        if: runner.os == 'Windows'
        run: |
          & ./out/write-corpus/write-corpus.exe check --root testdata/write-corpus
          if ($LASTEXITCODE -ne 0) { throw "check exited with $LASTEXITCODE" }
          & ./out/write-corpus/write-corpus.exe run --root testdata/write-corpus
          if ($LASTEXITCODE -ne 0) { throw "run exited with $LASTEXITCODE" }

      # The published size of the PDF app and its zip against the limits (budget x 1.25) recorded from the owner's measurement runs
      # (Docs/DECISIONS.md, "Raffica PDF speed budgets (M2.1)"; the single copy of the table is CheckCommand in measure.cs): exit 1 above a
      # limit, no CSV. A miss is a finding for the owner, never a loosened limit. --no-cache for the reason given at the gallery step.
      - name: Size of the published PDF app
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: dotnet run --no-cache bench/shell-probe/measure.cs -- size --check ${{ matrix.rid }} --target pdf --publish-dir out/pdf --fonts-dir src/Raffica.Shell/Assets/Fonts

      - name: Smoke test of the PDF app binary (Linux)
        if: runner.os == 'Linux'
        run: |
          de=$(./out/pdf/RafficaPdf --print-string TabView --lang de)
          [ "$de" = "Ansicht" ] || { echo "expected 'Ansicht' with --lang de, got: $de" >&2; exit 1; }
          en=$(./out/pdf/RafficaPdf --print-string TabView --lang en)
          [ "$en" = "View" ] || { echo "expected 'View' with --lang en, got: $en" >&2; exit 1; }
          echo "the published PDF app prints German and English strings"

      # RafficaPdf.exe is a GUI-subsystem program, like the gallery: Start-Process -Wait with redirected output files.
      - name: Smoke test of the PDF app binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $exe = (Resolve-Path ./out/pdf/RafficaPdf.exe).Path
          foreach ($case in @(@('de', 'Ansicht'), @('en', 'View'))) {
            $lang = $case[0]; $expected = $case[1]
            $out = Join-Path $env:RUNNER_TEMP "pdf-$lang.out"
            $err = Join-Path $env:RUNNER_TEMP "pdf-$lang.err"
            $p = Start-Process -FilePath $exe -ArgumentList '--print-string', 'TabView', '--lang', $lang -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if ($p.ExitCode -ne 0) { throw "--lang $lang exited with $($p.ExitCode): $(Get-Content $err -Raw)" }
            $text = (Get-Content $out -Raw).Trim()
            if ($text -ne $expected) { throw "expected '$expected' with --lang $lang, got: '$text'" }
          }
          Write-Host 'the published PDF app prints German and English strings'

  # macOS (spec 2026-11-09-raffica-macos-design.md, section 7): the build, the tests, the Native AOT publish for both architectures
  # and the smoke tests, the Intel build through Rosetta. Hosted runner only. It is part of the required check "ci" only when the
  # "changes" job asked for it.
  build-macos:
    name: build-macos
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The runner is Apple Silicon: the osx-x64 binaries run through Rosetta 2.
      - name: Check Rosetta
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Restore
        run: dotnet restore Raffica.slnx

      - name: Build
        run: dotnet build Raffica.slnx -c Release --no-restore

      - name: Fetch the OCR library and the language data (arm64)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run tools/native-fetch.cs -- --rid osx-arm64 --out artifacts/native/osx-arm64

      - name: Test
        env:
          RAFFICA_REQUIRE_OCR: '1'
        run: |
          set -o pipefail
          dotnet test Raffica.slnx -c Release --no-build --max-parallel-test-modules 1 2>&1 | tee "$RUNNER_TEMP/macos-test.log"

      # The runner prints "skipped <test>" and the reason on the next line. A skip that only macOS causes starts its reason with
      # "macOS:" (listed here for the owner); a skip with no reason at all fails the job.
      - name: List the skipped tests and check their reasons
        run: |
          esc=$(printf '\033')
          sed "s/${esc}\[[0-9;]*m//g" "$RUNNER_TEMP/macos-test.log" | awk '
            /^[0-9TZ:.-]* *skipped / { sub(/^[0-9TZ:.-]* */, ""); name = substr($0, 9); getline; reason = $0
              sub(/^[ \t]+/, "", reason)
              if (reason ~ /^from / || reason == "") { reason = "" }
              if (reason == "") { print "NOREASON " name } else if (reason ~ /^macOS:/) { print "MACOS " name " -- " reason } else { other++ } }
            END { print "OTHER " other + 0 }' > "$RUNNER_TEMP/skips.txt"
          echo "Skipped on macOS because of macOS:"
          grep '^MACOS ' "$RUNNER_TEMP/skips.txt" | sed 's/^MACOS /  /' || true
          grep '^OTHER ' "$RUNNER_TEMP/skips.txt" | sed 's/^OTHER /Skipped for other reasons (every system): /'
          if grep -q '^NOREASON ' "$RUNNER_TEMP/skips.txt"; then
            echo "Skipped tests without a reason:" >&2
            grep '^NOREASON ' "$RUNNER_TEMP/skips.txt" | sed 's/^NOREASON /  /' >&2
            exit 1
          fi

      - name: Upload the render diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff-macos
          path: tests/Raffica.Render.Tests/**/render-diff/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Self-test of the OCR library fetch
        run: dotnet run tools/native-fetch.cs -- selftest

      - name: Self-test of the binary check
        run: dotnet run tools/check-binary.cs -- selftest

      - name: Self-test of the licence tool
        run: dotnet run tools/licenses.cs -- selftest

      # The x64 OCR files are fetched first so that the x64 publish folder carries them.
      - name: Fetch the OCR library and the language data (x64)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run tools/native-fetch.cs -- --rid osx-x64 --out artifacts/native/osx-x64

      - name: Publish the PDF app, the CLI and the Write corpus tool (Native AOT, both architectures)
        run: |
          set -eo pipefail
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/Raffica.Pdf -c Release -r "$rid" -o "out/pdf-$rid"
            dotnet publish src/Raffica.Cli -c Release -r "$rid" -o "out/cli-$rid"
            dotnet publish bench/write-corpus -c Release -r "$rid" -o "out/write-corpus-$rid" 2>&1 | tee "$RUNNER_TEMP/write-corpus-publish-$rid.log"
            if grep -E 'IL[23][0-9]{3}' "$RUNNER_TEMP/write-corpus-publish-$rid.log"; then echo "$rid: the Write corpus tool publish has trim or AOT warnings" >&2; exit 1; fi
          done

      # The Write corpus tool runs natively (arm64) and the Intel build through Rosetta.
      - name: Corpus check and round trip of the published tool
        run: |
          set -e
          for pair in osx-arm64: osx-x64:"arch -x86_64"; do
            rid=${pair%%:*}; runner=${pair#*:}
            exe="out/write-corpus-$rid/write-corpus"
            $runner "$exe" check --root testdata/write-corpus
            $runner "$exe" run --root testdata/write-corpus
          done

      - name: Check the architecture of the executables
        run: |
          set -e
          for pair in osx-arm64:arm64 osx-x64:x86_64; do
            rid=${pair%%:*}; want=${pair##*:}
            for exe in "out/pdf-$rid/RafficaPdf" "out/cli-$rid/raffica"; do
              got=$(lipo -archs "$exe")
              [ "$got" = "$want" ] || { echo "$exe: expected '$want', lipo says '$got'" >&2; exit 1; }
              echo "$exe: $got"
            done
          done

      # --print-string runs before any window exists, so no display is needed. The Intel build runs through Rosetta (arch -x86_64).
      - name: Smoke test of the PDF app binary
        run: |
          set -e
          for pair in osx-arm64: osx-x64:"arch -x86_64"; do
            rid=${pair%%:*}; runner=${pair#*:}
            exe="out/pdf-$rid/RafficaPdf"
            de=$($runner "$exe" --print-string TabView --lang de)
            [ "$de" = "Ansicht" ] || { echo "$rid: expected 'Ansicht' with --lang de, got: $de" >&2; exit 1; }
            en=$($runner "$exe" --print-string TabView --lang en)
            [ "$en" = "View" ] || { echo "$rid: expected 'View' with --lang en, got: $en" >&2; exit 1; }
            echo "$rid: the published PDF app prints German and English strings"
          done

      - name: Smoke test of the CLI binary
        run: |
          set -e
          for pair in osx-arm64: osx-x64:"arch -x86_64"; do
            rid=${pair%%:*}; runner=${pair#*:}
            exe="out/cli-$rid/raffica"
            $runner "$exe" --help > /dev/null
            text=$($runner "$exe" text testdata/pdfs/text-basic.pdf)
            case "$text" in *"Hello,"*) echo "$rid: text extraction works" ;; *) echo "$rid: unexpected output: $text" >&2; exit 1 ;; esac
          done

      # The same steps as release-macos (release.yml: licence check, bundle, dependency check, smoke test of the bundle CLI), on the folders published above (they already carry the OCR files, so no
      # --native). The version 0.0.0 only has to be stable; nothing here is uploaded to a release.
      - name: Self-test of the packaging tool
        run: dotnet run tools/package.cs -- selftest

      - name: Bundle, image and smoke (both architectures)
        run: |
          set -euo pipefail
          macos_min="$(grep '^MACOS_DEPLOYMENT_TARGET=' packaging/native/versions.txt | cut -d= -f2)"
          mkdir -p out/dmg
          for rid in osx-arm64 osx-x64; do
            case "$rid" in
              osx-arm64) short=arm64; machine=arm64 ;;
              osx-x64) short=x64; machine=x86_64 ;;
            esac
            echo "=== $rid ==="
            dotnet run tools/licenses.cs -- check --publish-dir "out/pdf-$rid" --publish-dir "out/cli-$rid"
            dotnet run tools/package.cs -- macos-app --rid "$rid" --app "out/pdf-$rid" --cli "out/cli-$rid" --out "out/bundle-$rid" --version 0.0.0
            bundle="out/bundle-$rid/Raffica PDF.app"
            macos_dir="$bundle/Contents/MacOS"
            dotnet run tools/check-binary.cs -- "$macos_dir/RafficaPdf" "$macos_dir/raffica" "$macos_dir"/*.dylib --arch "$machine" --max-macos "$macos_min" --bundle "$macos_dir"
            # The bundle's own CLI (the Intel one runs through Rosetta when started directly). Both bundles carry the OCR files (the library and
            # the language data are fetched for osx-arm64 and osx-x64 above and copied into each publish folder), so the real OCR run happens for both.
            dotnet run tools/smoke-cli.cs -- "$macos_dir/raffica"
            dmg="out/dmg/RafficaPdf-0.0.0-macos-$short.dmg"
            dotnet run tools/package.cs -- dmg --app "$bundle" --rid "$rid" --version 0.0.0 --out "$dmg"
            dotnet run tools/package.cs -- dmg-smoke --dmg "$dmg" --rid "$rid"
          done

      # The published sizes of both architectures against the one `macos` entry of s_pdfBudgets in measure.cs (size, zip, app, dmg; the budgets of
      # Docs/DECISIONS.md, "Raffica PDF on macOS: published sizes and the hosted record (M3.3)"). `--check <rid>` judges the four sizes only (it asks
      # for no time or memory metric) and exits 1 above a limit; `set +e` in the script keeps the loop going, so both architectures are checked (and shown) before the step fails. The
      # output (a table in MiB with budget and limit) goes to the log and the step summary. --no-cache and the job temp folder for the reason
      # given at the gallery step of the other jobs.
      - name: Sizes of the published app
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          # GitHub runs this under `bash -e {0}`: -e must be off here, or the first rid over its limit would end the shell inside the pipe
          # and the second would never be checked. pipefail makes PIPESTATUS[0] the exit code of dotnet, read right after the pipe.
          set -uo pipefail
          set +e
          failed=0
          for rid in osx-arm64 osx-x64; do
            case "$rid" in
              osx-arm64) short=arm64 ;;
              osx-x64) short=x64 ;;
            esac
            echo "=== sizes $rid ==="
            out="$RUNNER_TEMP/sizes-$rid.txt"
            dotnet run --no-cache bench/shell-probe/measure.cs -- size --target pdf --check "$rid" --publish-dir "out/pdf-$rid" --fonts-dir src/Raffica.Shell/Assets/Fonts --app "out/bundle-$rid/Raffica PDF.app" --dmg "out/dmg/RafficaPdf-0.0.0-macos-$short.dmg" | tee "$out"
            code=${PIPESTATUS[0]}
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### Published sizes $rid (MiB)"
                echo
                grep '^|' "$out" || true
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$code" -ne 0 ]; then
              echo "::error title=Sizes::the published size check of $rid exited $code"
              failed=1
            fi
          done
          exit "$failed"

      # The default macOS volume ignores case: Bericht.pdf and bericht.pdf are one file. The CLI must see that (PathRules) and refuse,
      # not overwrite its own input. This is the path comparison; the file identity is the next step.
      - name: Smoke test of the same-file guard
        run: |
          for pair in osx-arm64: osx-x64:"arch -x86_64"; do
            rid=${pair%%:*}; runner=${pair#*:}
            exe="out/cli-$rid/raffica"
            dir="$RUNNER_TEMP/samefile-$rid"
            mkdir -p "$dir"
            cp testdata/pdfs/text-basic.pdf "$dir/Bericht.pdf"
            code=0
            out=$($runner "$exe" rotate "$dir/Bericht.pdf" --pages all --angle 90 --output "$dir/bericht.pdf" 2>&1) || code=$?
            echo "$out"
            [ "$code" -ne 0 ] || { echo "$rid: rotate onto the same file exited 0" >&2; exit 1; }
            case "$out" in *"must not be the input file"*) echo "$rid: the same file is refused" ;; *) echo "$rid: the refusal does not say 'must not be the input file'" >&2; exit 1 ;; esac
          done

      # Two names of one file that no path comparison can tell apart: a hard link. Only FileIdentity (stat$INODE64 on x64 under
      # Rosetta, stat on arm64) can see that they are one file; --force leaves it as the only guard.
      - name: Smoke test of the hard-link guard
        run: |
          for pair in osx-arm64: osx-x64:"arch -x86_64"; do
            rid=${pair%%:*}; runner=${pair#*:}
            exe="out/cli-$rid/raffica"
            dir="$RUNNER_TEMP/hardlink-$rid"
            mkdir -p "$dir"
            cp testdata/pdfs/text-basic.pdf "$dir/Bericht.pdf"
            ln "$dir/Bericht.pdf" "$dir/Zweit.pdf"
            code=0
            out=$($runner "$exe" rotate "$dir/Bericht.pdf" --pages all --angle 90 --output "$dir/Zweit.pdf" --force 2>&1) || code=$?
            echo "$out"
            [ "$code" -ne 0 ] || { echo "$rid: rotate onto a hard link of the input exited 0" >&2; exit 1; }
            case "$out" in *"same file under another name or path"*) echo "$rid: the hard link is refused through the file identity" ;; *) echo "$rid: the refusal does not say 'same file under another name or path'" >&2; exit 1 ;; esac
          done

      # The Intel disk image, for the owner's manual check on an Intel Mac (packaging/README.md).
      - name: Upload the Intel disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raffica-pdf-macos-x64-dmg
          path: out/dmg/RafficaPdf-0.0.0-macos-x64.dmg
          if-no-files-found: error
          retention-days: 3

  # The required status check: it passes when the build passed, or when there was nothing to build (documentation only,
  # draft), so the matrix can change without touching the branch protection.
  ci:
    name: ci
    if: always()
    needs: [changes, build, build-macos]
    runs-on: ${{ fromJSON((github.event.repository.private == false || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-24.04"]' || '["self-hosted","dotnet-linux"]') }}
    timeout-minutes: 5
    steps:
      - name: All build jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BUILD: ${{ needs.build.result }}
          MACOS_WANTED: ${{ needs.changes.outputs.macos }}
          MACOS: ${{ needs['build-macos'].result }}
        run: |
          echo "changes: $CHANGES, code: $CODE, build: $BUILD, macos: $MACOS_WANTED/$MACOS"
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then test "$BUILD" = success; else echo "nothing to build"; fi
          # Skipped (not asked for) counts as passed; asked for, it must have succeeded.
          if [ "$MACOS_WANTED" = true ]; then test "$MACOS" = success; else echo "no macOS build asked for"; fi
