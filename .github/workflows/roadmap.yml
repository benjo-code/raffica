name: Roadmap

# Runs only when a pull request (not a draft) touches the roadmap files, or on a push to main; otherwise the job
# reports success at once, so the required status check "roadmap" never waits. A pull request from a fork goes to a
# GitHub-hosted runner, everything else to the owner's self-hosted runner.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Stale runs of the same ref are cancelled so the shared runners are not blocked.
concurrency:
  group: roadmap-${{ github.ref }}
  cancel-in-progress: true

# No artifacts and no cache: the job only reads the repository and writes nothing the runner has to keep.
jobs:
  roadmap:
    name: roadmap
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-24.04"]' || '["self-hosted","dotnet-linux"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide
        id: relevant
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then
            echo "A draft pull request is not checked."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != pull_request ] || [ "$BASE" = main ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout of a pull request is the merge commit; its first parent is the tip of the base branch.
          run=false
          while IFS= read -r f; do
            case "$f" in
              Docs/roadmap.json|Docs/roadmap.schema.json|Docs/ROADMAP.md|tools/roadmap.cs|.github/workflows/roadmap.yml) run=true ;;
            esac
          done <<< "$(git diff --name-only HEAD^1 HEAD)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install the .NET SDK into HOME (no root on the runner)
        if: steps.relevant.outputs.run == 'true'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.relevant.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Check the roadmap
        if: steps.relevant.outputs.run == 'true'
        run: dotnet run tools/roadmap.cs -- check
